[project]
name = "quant-agent"
version = "0.1.0"
description = "个人量化研究系统：数据管道 + 回测引擎 + Claude Code 研究助手"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "akshare>=1.14",
    "yfinance>=0.2.40",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    "exchange-calendars==4.13.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.optional-dependencies]
integration = ["gpt-quant>=0.1,<0.2"]

[project.scripts]
quant = "quant.cli:main"

[tool.uv.sources]
gpt-quant = { path = "../gpt_quant" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
