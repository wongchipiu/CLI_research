# 股票池配置。A股代码用 6 位字符串；美股用 ticker。
# cn_index 是 A股基准指数（000300 = 沪深300），美股基准直接放在 us 里（SPY）。

cn:
  - "600519"   # 贵州茅台
  - "000858"   # 五粮液
  - "601318"   # 中国平安
  - "600036"   # 招商银行
  - "000001"   # 平安银行

cn_index:
  - "000300"   # 沪深300（基准）

us:
  - AAPL
  - MSFT
  - NVDA
  - GOOGL
  - SPY        # 美股基准
